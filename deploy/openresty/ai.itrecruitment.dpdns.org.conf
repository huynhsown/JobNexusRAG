upstream jobnexus_ai_backend {
    server 172.16.64.68:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name ai.itrecruitment.dpdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.itrecruitment.dpdns.org;

    ssl_certificate     /etc/ssl/cloudflare/itrecruitment-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/itrecruitment-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    location / {
        proxy_pass http://jobnexus_ai_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
